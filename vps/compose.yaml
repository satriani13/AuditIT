services:
  fieldbook:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5180:5180"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5180
      DATA_DIR: /app/data
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
    volumes:
      - fieldbook-data:/app/data
volumes:
  fieldbook-data:
